name: Build Android Debug APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.claude/**'
      - 'calpro-database*.sql'
  workflow_dispatch:

# Cancel in-progress runs for the same branch
concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # needed to publish the APK to a GitHub Release

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install npm deps
        run: npm install --no-audit --no-fund

      - name: Prepare www/ (copy PWA assets)
        run: npm run prepare:www

      - name: Initialize Capacitor + add Android platform
        run: |
          # First-time setup in CI: capacitor.config.json already in repo;
          # `cap add android` scaffolds android/ project from scratch.
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Enable edge-to-edge (overwrite MainActivity)
        run: |
          # Draw the WebView behind the (transparent) status + navigation bars so
          # the app uses the full screen, while the clock/battery stay visible.
          # We copy a complete, known-good MainActivity over the generated one
          # (no fragile in-place sed) — appId package is com.calpro.app.
          MA_DIR="android/app/src/main/java/com/calpro/app"
          mkdir -p "$MA_DIR"
          cp android-overrides/MainActivity.java "$MA_DIR/MainActivity.java"
          echo "Wrote edge-to-edge MainActivity:"; cat "$MA_DIR/MainActivity.java"

      - name: Prepare resources/ for capacitor-assets
        run: |
          mkdir -p resources
          # Use existing icon-512 as source (resize would be ideal but icon-512 works)
          cp icon-512.png resources/icon.png
          # Splash: black bg with centered icon (capacitor-assets will adapt)
          cp icon-512.png resources/splash.png || true
          cp icon-512.png resources/splash-dark.png || true
          ls -lh resources/

      - name: Generate native icons + splash from resources/
        run: |
          npx capacitor-assets generate --android --iconBackgroundColor "#0f0f14" --iconBackgroundColorDark "#0f0f14" --splashBackgroundColor "#0f0f14" --splashBackgroundColorDark "#0f0f14" || echo "[warn] asset generation had issues but continuing"

      - name: Patch Android app config (versionCode + label)
        run: |
          # Sync versionName from APP_VERSION constant in calpro-app.html
          VERSION=$(grep -oP "APP_VERSION = '\K[0-9.]+" calpro-app.html | head -1)
          echo "App version: $VERSION"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          GRADLE_FILE="android/app/build.gradle"
          if [ -f "$GRADLE_FILE" ]; then
            # Replace versionName line; versionCode = build number for monotonic ordering
            sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" "$GRADLE_FILE"
            sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" "$GRADLE_FILE"
            grep -E "version(Name|Code)" "$GRADLE_FILE" || true
          fi

      - name: Capacitor sync (copy web assets + plugins into native)
        run: npx cap sync android

      - name: Grant gradlew execute permission
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "Found APK: $APK_PATH"
          echo "path=$APK_PATH" >> $GITHUB_OUTPUT
          ls -lh "$APK_PATH"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v7
        with:
          name: calpro-plus-debug-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30
          if-no-files-found: error

      # Publish to a GitHub Release so the in-app auto-updater has a stable,
      # public download URL: .../releases/latest/download/calpro-plus.apk
      # The fixed asset name is what the app's APK_UPDATE.apkUrl points at.
      - name: Stage APK with a stable name
        run: cp "${{ steps.apk.outputs.path }}" calpro-plus.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: CalPro+ v${{ env.APP_VERSION }}
          body: |
            CalPro+ v${{ env.APP_VERSION }} — Android debug APK.
            Installed users are prompted to update automatically in-app.
          files: calpro-plus.apk
          make_latest: true
          fail_on_unmatched_files: true

      - name: Summary
        run: |
          echo "## ✅ APK built · v${APP_VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Public download (used by the in-app updater):**" >> $GITHUB_STEP_SUMMARY
          echo "\`https://github.com/${{ github.repository }}/releases/latest/download/calpro-plus.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Also attached to the run as artifact \`calpro-plus-debug-apk\`." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Install on Android phone:" >> $GITHUB_STEP_SUMMARY
          echo "1. Enable **Install unknown apps** for your browser/file manager" >> $GITHUB_STEP_SUMMARY
          echo "2. Open the .apk file → Install" >> $GITHUB_STEP_SUMMARY
          echo "3. Launch **CalPro+** from your home screen" >> $GITHUB_STEP_SUMMARY
